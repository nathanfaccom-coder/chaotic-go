name: Verificar publicação pública (Chaotic GO)
on:
  workflow_run:
    workflows:
      - "Publicar versão aprovada no GitHub Pages (Chaotic GO)"
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: chaotic-public-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-public-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Consultar endereço e configuração reais do GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code="$(curl --location --silent --show-error --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            --output /tmp/chaotic-pages.json --write-out '%{http_code}' "$api")"
          if [ "$code" != "200" ]; then
            echo "::error::Não foi possível consultar a configuração do GitHub Pages (HTTP $code). Verifique Settings > Pages e o acesso do workflow."
            printf 'GitHub Pages: API HTTP %s\n' "$code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          url="$(jq -r '.html_url // ""' /tmp/chaotic-pages.json)"
          status="$(jq -r '.status // "unknown"' /tmp/chaotic-pages.json)"
          source="$(jq -r '.build_type // (.source.branch // "unknown")' /tmp/chaotic-pages.json)"
          printf 'Endereço: %s\nStatus: %s\nOrigem: %s\n' "$url" "$status" "$source" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Pages status=$status build_type=$source branch=$(jq -r '.source.branch // "none"' /tmp/chaotic-pages.json) path=$(jq -r '.source.path // "none"' /tmp/chaotic-pages.json) URL=$url"
          if [[ "$url" != https://* ]]; then
            echo "::error::Pages não retornou uma URL HTTPS válida."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Testar página principal e arquivos essenciais
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}/"
          expected="$(sed -nE 's/.*VERSÃO (0[.]1[.][0-9]+).*/\1/p' index.html | head -1)"
          [ -n "$expected" ] || { echo "::error::Versão não identificada no index local"; exit 1; }
          # Pages deploy can finish after the publishing action. Wait for the
          # public version to match before asserting the remaining assets.
          current=""
          for attempt in {1..12}; do
            code="$(curl --location --silent --show-error --max-time 20 \
              --output /tmp/chaotic-site-index.html --write-out '%{http_code}' "${base}index.html")"
            current="$(grep -oE 'VERSÃO 0[.]1[.][0-9]+' /tmp/chaotic-site-index.html | head -1 || true)"
            if [ "$code" = "200" ] && [ "$current" = "VERSÃO ${expected}" ]; then break; fi
            echo "Aguardando versão pública: ${current:-sem versão}; esperada: ${expected}"
            sleep 10
          done
          if [ "$current" != "VERSÃO ${expected}" ]; then
            echo "::error::Página pública desatualizada: ${current:-desconhecida}; esperada ${expected}"
            exit 1
          fi
          # Verify the real entry chain: splash -> login -> scanner -> authenticated
          # bootstrap -> private DROME. A 200 on index alone does not prove
          # that login or the battle can load on Android.
          declare -a paths=(
            "index.html" "login-completo.html" "scanner.html" "scanner-completo.html"
            "login-auth.js" "auth-client.js" "supabase-config.js"
            "full-game-bootstrap.js" "supabase-game-bridge.js"
            "script.js" "batalha.js" "cartas.js" "efeitos.js" "entrada-drome.js"
            "chaotic-lobby.js" "sw.js" "style.css" "entrada-drome.css"
            "manifest.json" "logo.png"
          )
          for path in "${paths[@]}"; do
            code="$(curl --location --silent --show-error --max-time 25 \
              --output "/tmp/chaotic-site-${path##*/}" --write-out '%{http_code}' "${base}${path}")"
            if [ "$code" != "200" ]; then
              echo "::error::GitHub Pages: ${path} indisponível (HTTP ${code})"
              exit 1
            fi
            echo "- ${path}: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Versão remota: $(grep -oE 'VERSÃO 0[.]1[.][0-9]+' /tmp/chaotic-site-index.html | head -1 || true)"
          if ! grep -Fq "VERSÃO ${expected}" /tmp/chaotic-site-index.html; then
            echo "::error::Página pública está desatualizada; esperada versão ${expected}"
            exit 1
          fi
          if ! grep -Fq "chaotic_ping_preview_3x3_player" /tmp/chaotic-site-chaotic-lobby.js; then
            echo "::error::O DROME publicado está incompleto ou defasado."
            exit 1
          fi
          release_tag="${expected##*.}"
          # These are the exact routes/modules reached by a real player.
          if ! grep -Fq 'href="login-completo.html"' /tmp/chaotic-site-index.html; then
            echo "::error::A abertura não encaminha para o login atual."
            exit 1
          fi
          if ! grep -Fq 'login-auth.js' /tmp/chaotic-site-login-completo.html ||
             ! grep -Fq 'auth-client.js' /tmp/chaotic-site-login-completo.html; then
            echo "::error::Login publicado sem os scripts de autenticação."
            exit 1
          fi
          if ! grep -Fq "full-game-bootstrap.js?v=release-${release_tag}" /tmp/chaotic-site-scanner-completo.html; then
            echo "::error::Scanner completo não carrega o bootstrap da versão ${expected}."
            exit 1
          fi
          if ! grep -Fq "chaotic-lobby.js?v=release-${release_tag}" /tmp/chaotic-site-full-game-bootstrap.js; then
            echo "::error::O bootstrap publicado não carrega o DROME atualizado."
            exit 1
          fi
          if ! grep -Fq "chaotic-go-release-" /tmp/chaotic-site-sw.js ||
             ! grep -Fq "release-${release_tag}" /tmp/chaotic-site-sw.js; then
            echo "::error::Service Worker não corresponde à versão pública."
            exit 1
          fi
          echo "✅ Abertura, login, scanner, bootstrap, DROME e cache verificados na versão ${expected}." >> "$GITHUB_STEP_SUMMARY"
          echo "Observação: HTTP 200 e scripts atualizados não substituem teste com dois celulares." >> "$GITHUB_STEP_SUMMARY"
