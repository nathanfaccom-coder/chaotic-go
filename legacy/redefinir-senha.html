<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — Chaotic GO</title><link rel="stylesheet" href="style.css"></head><body><h2>Redefinir senha</h2><input id="nova" type="password" minlength="8" placeholder="Nova senha (mín. 8 caracteres)"><button id="salvar">Salvar senha</button><p id="status" role="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script><script>document.getElementById("salvar").onclick=async()=>{const el=document.getElementById("status");try{const value=document.getElementById("nova").value;if(value.length<8)throw Error("Use pelo menos 8 caracteres.");const {error}=await ChaoticAuth.getClient().auth.updateUser({password:value});if(error)throw error;el.textContent="Senha alterada. Volte ao login."; }catch(e){el.textContent=e.message;}};</script></body></html>
