<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic GO - Abertura</title> 
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=release-132', { updateViaCache: 'none' })
          .then(() => console.log("Atualização do scanner instalada"))
          .catch(err => console.log("Erro no sinal do Service Worker:", err));
      }
    </script>
</head>
<body>
    
    <div id="painel-instalacao" style="display: none; position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #111; border: 2px solid #4CAF50; padding: 15px; border-radius: 10px; z-index: 10000; text-align: center; width: min(85%, 400px); box-sizing: border-box; box-shadow: 0 0 15px #4CAF50; font-family: monospace;">
        <p style="color: white; font-size: 14px; margin-top: 0; margin-bottom: 15px;">Deseja instalar o Scanner no seu terminal para acesso rápido no celular?</p>
        <p id="instrucoes-ios" style="display: none; color: #fff; font-size: 13px; line-height: 1.5;">No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p>
        <button id="btn-instalar" type="button" disabled style="background: #4CAF50; color: black; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-right: 10px;">INSTALAR</button>
        <button id="btn-fechar-install" type="button" style="background: #ff5555; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer;">AGORA NÃO</button>
    </div>
    
    <a href="login-completo.html">
        <img src="logo.png" alt="Logotipo Chaotic GO" id="logo-abertura">
    </a>

    <p class="creditos">DESENVOLVIDO POR NATHAN REIS</p>
    <p class="versao">VERSÃO 0.1.132</p>

    <script>
        let deferredPrompt = null;
        let installInProgress = false;
        let dismissedThisSession = false;
        const painelInstalacao = document.getElementById('painel-instalacao');
        const btnInstalar = document.getElementById('btn-instalar');
        const instrucoesIos = document.getElementById('instrucoes-ios');
        // iPadOS 13+ can report a Macintosh user agent even in Safari.
        const isAppleMobile = () => /iPad|iPhone|iPod/.test(navigator.userAgent)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isIosSafari = () => isAppleMobile()
          && /Safari/.test(navigator.userAgent)
          && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|GSA/.test(navigator.userAgent);
        const btnFecharInstall = document.getElementById('btn-fechar-install');
        const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;

        function syncInstallPanel() {
            const canInstall = !!deferredPrompt && !installInProgress
              && !dismissedThisSession && !isStandalone();
            const showIosHelp = isIosSafari() && !dismissedThisSession && !isStandalone();
            painelInstalacao.style.display = (canInstall || showIosHelp) ? 'block' : 'none';
            instrucoesIos.style.display = showIosHelp && !canInstall ? 'block' : 'none';
            btnInstalar.style.display = canInstall ? 'inline-block' : 'none';
            btnInstalar.disabled = !canInstall;
        }

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            syncInstallPanel();
        });

        btnInstalar.addEventListener('click', async () => {
            if (!deferredPrompt || installInProgress || isStandalone()) return;
            const promptEvent = deferredPrompt;
            deferredPrompt = null; // Each browser install prompt can only be used once.
            installInProgress = true;
            syncInstallPanel();
            try {
                await promptEvent.prompt();
                const choice = await promptEvent.userChoice;
                if (choice?.outcome === 'dismissed') dismissedThisSession = true;
            } catch (error) {
                console.warn('Não foi possível abrir a instalação:', error);
                dismissedThisSession = true;
            } finally {
                installInProgress = false;
                syncInstallPanel();
            }
        });

        btnFecharInstall.addEventListener('click', () => {
            dismissedThisSession = true;
            syncInstallPanel();
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            dismissedThisSession = true;
            syncInstallPanel();
        });
        window.matchMedia('(display-mode: standalone)')
          .addEventListener?.('change', syncInstallPanel);
        syncInstallPanel();
    </script>
</body>
</html>
